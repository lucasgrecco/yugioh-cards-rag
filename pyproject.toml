[project]
name = "poc-rag"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.18.4",
    "langsmith>=0.7.32",
    "openai>=2.32.0",
    "pgvector>=0.4.2",
    "psycopg2-binary>=2.9.11",
    "sqlalchemy>=2.0.49",
    "tqdm>=4.67.0",
    "tenacity>=9.0.0",
    "watchdog>=6.0.0",
    "mcp>=1.27,<2",
    "asyncpg>=0.30.0",
    "greenlet>=3.0.0",
    "sentence-transformers>=3.0.0",
]

[project.scripts]
ygo-search = "app.mcp_server:main"

[dependency-groups]
# `tests/` existia sem runner declarado: nenhum venv tinha pytest, e `uv sync` poda o
# que não está aqui — instalar à mão não sobrevive ao próximo sync.
dev = [
    "pytest>=8",
]

[tool.uv]
package = true

[tool.setuptools.packages.find]
include = ["app*"]
